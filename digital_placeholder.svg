<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Digital campaign placeholder">
  <!-- Background -->
  <rect width="800" height="500" fill="#F3EEE4"/>
  <!-- Frame -->
  <rect x="1" y="1" width="798" height="498" fill="none" stroke="#D9D2C4" stroke-width="2"/>
  <!-- Faux browser chrome -->
  <rect x="0" y="0" width="800" height="40" fill="#E8E1D3"/>
  <circle cx="20" cy="20" r="6" fill="#D9D2C4"/>
  <circle cx="40" cy="20" r="6" fill="#D9D2C4"/>
  <circle cx="60" cy="20" r="6" fill="#D9D2C4"/>
  <rect x="90" y="10" width="680" height="20" rx="4" fill="#FAF7F2" stroke="#D9D2C4" stroke-width="1"/>
  <!-- Main icon area: abstract chart / screen representation -->
  <g transform="translate(400, 260)" text-anchor="middle" fill="#6B6559" font-family="Georgia, serif" font-style="italic" font-size="22">
    <text y="-30">Digital Campaign Asset</text>
    <text y="10" font-size="16" font-style="normal" font-family="sans-serif">Placeholder — image to be added</text>
  </g>
  <!-- Decorative chart lines -->
  <g stroke="#C45E30" stroke-width="2" fill="none" opacity="0.35">
    <polyline points="100,400 200,380 280,350 380,320 460,290 560,260 660,220 720,200"/>
  </g>
  <g fill="#0E2A47" opacity="0.15">
    <rect x="100" y="430" width="40" height="40"/>
    <rect x="160" y="410" width="40" height="60"/>
    <rect x="220" y="390" width="40" height="80"/>
    <rect x="280" y="370" width="40" height="100"/>
    <rect x="340" y="350" width="40" height="120"/>
    <rect x="400" y="330" width="40" height="140"/>
    <rect x="460" y="310" width="40" height="160"/>
    <rect x="520" y="290" width="40" height="180"/>
    <rect x="580" y="270" width="40" height="200"/>
    <rect x="640" y="250" width="40" height="220"/>
  </g>
</svg>